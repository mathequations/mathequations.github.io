<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <style>
        /* Forces the launcher and the game to take up the absolute entire screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Container designed to hold the game string data perfectly */
        #game-container {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* If you are using an iframe to inject the game, this keeps it full screen */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="game-container"></div>

    <script src="games.js"></script>

    <script>
        // Main function to launch the game safely
        function launchGame(gameId) {
            const container = document.getElementById('game-container');
            
            // 1. Verify the game exists in your database object
            if (gameDatabase && gameDatabase[gameId]) {
                
                // 2. Create a clean blob URL to safely load the full HTML string as a complete document
                const gameHtmlString = gameDatabase[gameId];
                const blob = new Blob([gameHtmlString], { type: 'text/html' });
                const gameUrl = URL.createObjectURL(blob);
                
                // 3. Inject a completely clean, borderless iframe taking up 100% of the viewport
                container.innerHTML = `<iframe src="${gameUrl}" allow="autoplay; fullscreen"></iframe>`;
                
                // NOTE: The ugly "game 1 loaded" text insertion logic has been completely wiped out here.
                
            } else {
                container.innerHTML = `<div style="color: white; padding: 20px;">Error: Game data for "${gameId}" could not be found.</div>`;
            }
        }

        // Automatically boot up game1 (Territorial.io) when the page loads
        window.addEventListener('DOMContentLoaded', () => {
            launchGame('game1');
        });
    </script>
</body>
</html>
