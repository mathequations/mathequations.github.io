<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCalc v2.1 - Online Scientific Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "MS Sans Serif", Geneva, sans-serif, Arial;
        }

        body { 
            background-color: #d4d0c8; 
            color: #000000; 
            margin: 0; 
            padding: 0; 
        }

        /* RETRO CALCULATOR LANDING PAGE */
        .retro-wrapper {
            max-width: 450px;
            margin: 50px auto;
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 15px;
            box-shadow: 1px 1px 0px #000000;
        }

        .retro-title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .retro-screen {
            width: 100%;
            height: 55px;
            background: #c0c0c0;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            margin-bottom: 15px;
            font-size: 24px;
            font-family: 'Courier New', Courier, monospace;
            color: #002200;
            text-align: right;
            padding: 10px;
            font-weight: bold;
            outline: none;
        }

        .retro-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .retro-grid button {
            padding: 15px 0;
            font-size: 14px;
            font-weight: bold;
            background: #d4d0c8;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            cursor: pointer;
        }

        .retro-grid button:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding-top: 16px;
            padding-left: 1px;
        }

        .retro-grid button.clear-btn { color: #ff0000; }
        .retro-grid button.op-btn { color: #0000ff; }
        .retro-grid button.eq-btn { color: #000000; background: #b5b0a5; }

        .retro-footer {
            text-align: center;
            font-size: 11px;
            color: #555555;
            margin-top: 15px;
            border-top: 1px solid #808080;
            padding-top: 8px;
        }

        .hidden { display: none !important; }

        /* MODERN ROBLOX THEME INTERFACE */
        .roblox-theme { background-color: #191b1d !important; color: #ffffff !important; min-height: 100vh; padding: 20px; }
        .roblox-header { border-bottom: 1px solid #393b3d; padding-bottom: 15px; margin-bottom: 25px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .roblox-header h2 { font-size: 1.6rem; font-weight: 700; margin: 0; color: #ffffff; font-family: sans-serif; }

        .roblox-wrapper { max-width: 1200px; margin: 0 auto; }
        .roblox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .roblox-card { background: #252729; border: 1px solid #393b3d; padding: 10px; cursor: pointer; }
        .roblox-card:hover { background: #2f3133; transform: translateY(-2px); }
        .roblox-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 1px solid #393b3d; margin-bottom: 12px; }
        .roblox-card-title { font-size: 0.95rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; text-align: center; font-family: sans-serif; }

        .roblox-player-controls { display: flex; gap: 10px; margin-top: 15px; }
        button.roblox-btn { background: #393b3d; border: 1px solid #555759; color: #ffffff; font-size: 0.85rem; padding: 10px 20px; border-radius: 3px; cursor: pointer; font-family: sans-serif; }
        button.roblox-btn:hover { background: #4f5153; }
        button.roblox-play-green { background: #00b06f; border: 1px solid #008f5a; color: #ffffff; }
        button.roblox-play-green:hover { background: #00c77e; }

        .roblox-frame-container { width: 100%; height: 650px; border: 1px solid #393b3d; background: #000000; position: relative; overflow: hidden; display: flex; align-items: stretch; justify-content: stretch; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000000; flex: 1; }
    </style>
</head>
<body id="body-context">

    <!-- THE DISGUISE FRONT PAGE -->
    <div id="calculator-page" style="padding-top: 40px;">
        <div class="retro-wrapper">
            <div class="retro-title-bar">
                <span>WebCalc Engine v2.1</span>
                <span>[X]</span>
            </div>
            
            <input type="text" class="retro-screen" id="calc-display" readonly value="0">
            
            <div class="retro-grid">
                <button class="clear-btn" onclick="clearCalc()">C</button>
                <button class="op-btn" onclick="pressOp('(')">(</button>
                <button class="op-btn" onclick="pressOp(')')">)</button>
                <button class="op-btn" onclick="pressOp('/')">/</button>

                <button onclick="pressNum('7')">7</button>
                <button onclick="pressNum('8')">8</button>
                <button onclick="pressNum('9')">9</button>
                <button class="op-btn" onclick="pressOp('*')">*</button>

                <button onclick="pressNum('4')">4</button>
                <button onclick="pressNum('5')">5</button>
                <button onclick="pressNum('6')">6</button>
                <button class="op-btn" onclick="pressOp('-')">-</button>

                <button onclick="pressNum('1')">1</button>
                <button onclick="pressNum('2')">2</button>
                <button onclick="pressNum('3')">3</button>
                <button class="op-btn" onclick="pressOp('+')">+</button>

                <button onclick="pressNum('0')">0</button>
                <button onclick="pressNum('.')">.</button>
                <button class="eq-btn" style="grid-column: span 2;" onclick="calculateResult()">=</button>
            </div>
            
            <div class="retro-footer">
                Standard JavaScript Math Emulator Engine © 2010
            </div>
        </div>
    </div>

    <!-- CLEAN INTERFACE CONTAINER (Stays hidden until triggered) -->
    <div id="portal-container" class="hidden roblox-wrapper">
        
        <!-- GAMES PORTAL -->
        <div id="games-portal">
            <div class="roblox-header">
                <h2>Games / Discover Experiences</h2>
            </div>
            
            <div class="roblox-grid">
                <div class="roblox-card" onclick="launchGame('game1')">
                    <img src="https://static.wikia.nocookie.net/territorial/images/e/e6/Site-logo.png/revision/latest?cb=20230727171424" alt="Game 1">
                    <div class="roblox-card-title">Territorial Sandbox</div>
                </div>
                <div class="roblox-card" onclick="launchGame('game2')">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=300" alt="Game 2">
                    <div class="roblox-card-title">Cyber Racer</div>
                </div>
            </div>
        </div>

        <!-- GAME DISPLAY CONTAINER -->
        <div id="game-display-view" class="hidden">
            <div class="roblox-frame-container" id="fullscreen-target">
                <iframe id="game-runner" src=""></iframe>
            </div>

            <div class="roblox-player-controls">
                <button class="roblox-btn" onclick="backToGames()">← Leave Game</button>
                <button class="roblox-btn roblox-play-green" onclick="goFullscreen()">Fullscreen Mode</button>
            </div>
        </div>

    </div>

<script src="games.js"></script>

<script>
    let currentInput = "";

    function pressNum(num) {
        if (document.getElementById('calc-display').value === "0") {
            currentInput = num;
        } else {
            currentInput += num;
        }
        document.getElementById('calc-display').value = currentInput;
    }

    function pressOp(op) {
        currentInput += op;
        document.getElementById('calc-display').value = currentInput;
    }

    function clearCalc() {
        currentInput = "";
        document.getElementById('calc-display').value = "0";
    }

    function calculateResult() {
        // TRAPDOOR: Hit 98 exactly to shift out of the 2010 theme
        if (currentInput === "98") {
            unlockArcade();
            return;
        }

        try {
            let result = Function('"use strict";return (' + currentInput + ')')();
            document.getElementById('calc-display').value = result;
            currentInput = result.toString();
        } catch (error) {
            document.getElementById('calc-display').value = "Error";
            currentInput = "";
        }
    }

    // Listens for physical keyboard Enter button inside calculator screen
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !document.getElementById('calculator-page').classList.contains('hidden')) {
            calculateResult();
        }
    });

    function unlockArcade() {
        document.getElementById('calculator-page').classList.add('hidden');
        document.getElementById('portal-container').classList.remove('hidden');
        document.getElementById('body-context').classList.add('roblox-theme');
    }

    function launchGame(gameKey) {
        document.getElementById('games-portal').classList.add('hidden');
        document.getElementById('game-display-view').classList.remove('hidden');
        
        const iframe = document.getElementById('game-runner');
        
        if (typeof gameDatabase === 'undefined') {
            iframe.srcdoc = "<h2 style='color:white;text-align:center;padding-top:50px;font-family:sans-serif;'>Error: games.js missing.</h2>";
            return;
        }

        const rawCode = gameDatabase[gameKey];
        
        if(rawCode) {
            const blob = new Blob([rawCode], { type: 'text/html' });
            iframe.src = URL.createObjectURL(blob);
        } else {
            iframe.srcdoc = "<h2 style='color:white;text-align:center;padding-top:50px;font-family:sans-serif;'>Error: Game not found.</h2>";
        }
    }

    function backToGames() {
        document.getElementById('game-display-view').classList.add('hidden');
        document.getElementById('games-portal').classList.remove('hidden');
        document.getElementById('game-runner').src = ""; 
    }

    function goFullscreen() {
        const target = document.getElementById('fullscreen-target');
        if (target.requestFullscreen) { target.requestFullscreen(); }
        else if (target.webkitRequestFullscreen) { target.webkitRequestFullscreen(); }
        else if (target.msRequestFullscreen) { target.msRequestFullscreen(); }
    }
</script>
</body>
</html>
