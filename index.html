<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Arcade</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Interface */
        #sidebar {
            width: 250px;
            background-color: #1e1e1e;
            border-right: 2px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        #sidebar h2 {
            margin-top: 0;
            font-size: 22px;
            color: #00ff99;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }

        .game-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3a3a3a;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .game-btn:hover {
            background-color: #00ff99;
            color: #121212;
            border-color: #00ff99;
            transform: translateX(3px);
        }

        .game-btn.active {
            background-color: #00ff99;
            color: #121212;
            border-color: #00ff99;
        }

        /* Game Display Viewport */
        #main-viewport {
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: #0a0a0a;
            position: relative;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Arcade</h2>
        <button class="game-btn" onclick="switchGame('game1', this)">Territorial.io</button>
    </div>

    <div id="main-viewport">
        <div id="game-container"></div>
    </div>

    <script src="games.js"></script>

    <script>
        function switchGame(gameId, buttonElement) {
            const container = document.getElementById('game-container');
            
            // Toggle highlight on navigation buttons
            const buttons = document.querySelectorAll('.game-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (buttonElement) {
                buttonElement.classList.add('active');
            }

            // Extract string text and isolate safely into a clean fullscreen iframe
            if (typeof gameDatabase !== 'undefined' && gameDatabase[gameId]) {
                const rawHtmlString = gameDatabase[gameId];
                const blob = new Blob([rawHtmlString], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);

                // Injects the game frame directly with zero debug text strings
                container.innerHTML = `<iframe src="${blobUrl}" allow="autoplay; fullscreen"></iframe>`;
            } else {
                container.innerHTML = `<div style="color: red; padding: 20px;">Error: Data for key "${gameId}" missing or empty.</div>`;
            }
        }

        // Auto-run game1 smoothly when page boots up
        window.addEventListener('DOMContentLoaded', () => {
            const firstBtn = document.querySelector('.game-btn');
            switchGame('game1', firstBtn);
        });
    </script>
</body>
</html>
